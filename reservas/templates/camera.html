{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contagem de Equipamentos - PROATI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      margin: 0;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { font-size: 1.25rem; text-align: center; margin-bottom: 1rem; }

    .camera-wrap {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 3 / 4;
    }
    #video, #canvas, #preview, #preview-anotada {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #canvas, #preview, #preview-anotada { display: none; }

    .controles {
      display: flex;
      gap: .8rem;
      margin-top: 1rem;
      width: 100%;
      max-width: 480px;
    }
    button {
      flex: 1;
      padding: .9rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #btn-capturar { background: #2563eb; color: white; }
    #btn-refazer { background: #475569; color: white; display: none; }
    #btn-enviar { background: #16a34a; color: white; display: none; }

    select, input[type="number"] {
      margin-top: .8rem;
      width: 100%;
      max-width: 480px;
      padding: .7rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
      font-size: 1rem;
    }

    .status {
      margin-top: 1rem;
      text-align: center;
      font-size: .95rem;
      min-height: 1.4rem;
    }
    .status.erro { color: #f87171; }
    .status.ok { color: #4ade80; }
    .status.info { color: #60a5fa; }

    .resultado {
      margin-top: 1rem;
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      border-radius: 10px;
      padding: 1rem;
      display: none;
    }
    .resultado h2 { margin: 0 0 .8rem; font-size: 1.1rem; }
    .resultado-item {
      display: flex;
      justify-content: space-between;
      padding: .5rem 0;
      border-bottom: 1px solid #334155;
    }
    .resultado-item:last-child { border-bottom: none; font-weight: bold; }

    /* Estilo para o overlay de carregamento */
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      z-index: 10;
      border-radius: 12px;
    }
    .loading-overlay.show { display: flex; }
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #334155;
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <h1>📷 Contagem de Notebooks e Tablets</h1>

  <select id="select-carrinho">
    <option value="notebook">Carrinho de Notebooks</option>
    <option value="tablet">Carrinho de Tablets</option>
  </select>

  <div class="camera-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <img id="preview" alt="Foto capturada"/>
    <img id="preview-anotada" alt="Imagem anotada com bounding boxes"/>
    <div class="loading-overlay" id="loading-overlay">
      <div class="spinner"></div>
      <span style="color:white; font-size: 1rem;">Analisando com YOLO...</span>
    </div>
  </div>

  <div class="controles">
    <button id="btn-capturar">📸 Capturar Foto</button>
    <button id="btn-refazer">↺ Refazer</button>
    <button id="btn-enviar">✅ Analisar com IA</button>
  </div>

  <p class="status" id="status"></p>

  <div class="resultado" id="resultado">
    <h2>✅ Resultado da Análise</h2>
    <div id="resultado-conteudo"></div>

    <div style="margin-top: 1rem;">
      <label>Quantidade manual (itens fora da visão):</label>
      <input type="number" id="qtd-manual" value="0" min="0" style="margin-top: 0.3rem;">
      <button onclick="calcularTotalFinal()" style="margin-top: 0.5rem; background:#8b5cf6; width:100%;">
        Calcular Total Final
      </button>
    </div>

    <div id="total-final" style="margin-top:1rem; font-size:1.3rem; text-align:center; display:none;">
      <strong>Total Final: <span id="total-soma">0</span></strong>
    </div>
  </div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const preview = document.getElementById('preview');
const previewAnotada = document.getElementById('preview-anotada');
const btnCapturar = document.getElementById('btn-capturar');
const btnRefazer = document.getElementById('btn-refazer');
const btnEnviar = document.getElementById('btn-enviar');
const statusEl = document.getElementById('status');
const selectCarrinho = document.getElementById('select-carrinho');
const resultadoBox = document.getElementById('resultado');
const resultadoConteudo = document.getElementById('resultado-conteudo');
const qtdManualInput = document.getElementById('qtd-manual');
const loadingOverlay = document.getElementById('loading-overlay');

let stream = null;
let fotoBase64 = null;
let ultimoResultado = null;

async function iniciarCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }
    });
    video.srcObject = stream;
    setStatus('');
  } catch (err) {
    setStatus('Erro ao acessar câmera: ' + err.message, 'erro');
  }
}

function pararCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
}

function setStatus(msg, tipo = '') {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (tipo ? ' ' + tipo : '');
}

function mostrarLoading(mostrar) {
  loadingOverlay.classList.toggle('show', mostrar);
}

btnCapturar.addEventListener('click', () => {
  const ctx = canvas.getContext('2d');
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  fotoBase64 = canvas.toDataURL('image/jpeg', 0.92);
  preview.src = fotoBase64;

  video.style.display = 'none';
  preview.style.display = 'block';
  previewAnotada.style.display = 'none';

  btnCapturar.style.display = 'none';
  btnRefazer.style.display = 'block';
  btnEnviar.style.display = 'block';

  pararCamera();
});

btnRefazer.addEventListener('click', () => {
  fotoBase64 = null;
  ultimoResultado = null;
  preview.style.display = 'none';
  previewAnotada.style.display = 'none';
  video.style.display = 'block';

  btnCapturar.style.display = 'block';
  btnRefazer.style.display = 'none';
  btnEnviar.style.display = 'none';
  resultadoBox.style.display = 'none';
  qtdManualInput.value = 0;
  document.getElementById('total-final').style.display = 'none';

  iniciarCamera();
});

btnEnviar.addEventListener('click', async () => {
  if (!fotoBase64) return;

  btnEnviar.disabled = true;
  mostrarLoading(true);
  setStatus('Analisando com YOLO...', 'info');

  try {
    const resp = await fetch("{% url 'analisar_foto' %}", {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken')
      },
      body: JSON.stringify({
        imagem: fotoBase64,
        tipo_carrinho: selectCarrinho.value
      })
    });

    const data = await resp.json();
    if (data.erro) throw new Error(data.erro);

    ultimoResultado = data;

    // Exibe a imagem anotada com os bounding boxes
    if (data.imagem_anotada) {
      preview.style.display = 'none';
      previewAnotada.src = data.imagem_anotada;
      previewAnotada.style.display = 'block';
      setStatus('✅ Análise concluída! Veja os bounding boxes na imagem.', 'ok');
    }

    mostrarResultado(data);

  } catch (err) {
    setStatus('Erro: ' + err.message, 'erro');
  } finally {
    btnEnviar.disabled = false;
    mostrarLoading(false);
  }
});

function mostrarResultado(data) {
  resultadoConteudo.innerHTML = '';

  if (data.contagens && Object.keys(data.contagens).length > 0) {
    Object.entries(data.contagens).forEach(([classe, qtd]) => {
      const div = document.createElement('div');
      div.className = 'resultado-item';
      div.innerHTML = `<span>${classe}</span><strong>${qtd}</strong>`;
      resultadoConteudo.appendChild(div);
    });
  } else {
    const div = document.createElement('div');
    div.className = 'resultado-item';
    div.innerHTML = `<span>Nenhum item detectado</span><strong>0</strong>`;
    resultadoConteudo.appendChild(div);
  }

  const totalDetectado = document.createElement('div');
  totalDetectado.className = 'resultado-item';
  totalDetectado.innerHTML = `<span>Total Detectado</span><strong>${data.total_detectado || 0}</strong>`;
  resultadoConteudo.appendChild(totalDetectado);

  resultadoBox.style.display = 'block';
}

function calcularTotalFinal() {
  if (!ultimoResultado) return;
  const detectado = ultimoResultado.total_detectado || 0;
  const manual = parseInt(qtdManualInput.value) || 0;
  const totalFinal = detectado + manual;

  document.getElementById('total-soma').textContent = totalFinal;
  document.getElementById('total-final').style.display = 'block';
  setStatus(`Total final: ${detectado} (IA) + ${manual} (manual) = ${totalFinal}`, 'ok');
}

function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let cookie of cookies) {
      cookie = cookie.trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

// Inicia tudo
iniciarCamera();
</script>
</body>
</html>
