{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
<div class="login-box">
    <h2>Defina sua nova senha</h2>
    <form method="POST" action="{% url 'redefinir_senha_confirmar' uidb64=uidb64 token=token %}">
        {% csrf_token %}
        <div class="input-box">
            <input type="password" name="senha" placeholder="Nova senha" required>
        </div>
        <div class="input-box">
            <input type="password" name="confirmar_senha" placeholder="Confirme a nova senha" required>
        </div>
        <button type="submit" class="login-btn">Salvar nova senha</button>
    </form>
    {% if messages %}
        <div style="color: red; text-align: center; margin-top: 15px; font-size: 14px;">
        {% for message in messages %}{{ message }}{% endfor %}
        </div>
    {% endif %}
</div>
</body>
</html>
