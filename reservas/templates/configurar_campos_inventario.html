<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campos do inventário</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #1e3a5f; }
        header { background: #1e3a5f; color: white; padding: 18px 24px; }
        main { max-width: 700px; margin: 28px auto; padding: 0 16px; }
        .card { background: white; padding: 24px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
        input, select { box-sizing: border-box; padding: 10px; margin-top: 8px; }
        .linha { display:grid; grid-template-columns: 1fr 180px 40px; gap:8px; margin:10px 0; align-items:center; }
        .linha input, .linha select { width:100%; margin:0; }
        .remover { background:#dc3545; color:white; padding:8px; }
        button, a { display: inline-block; padding: 10px 16px; border: 0; border-radius: 6px; text-decoration: none; font-weight: bold; cursor: pointer; }
        button { background: #28a745; color: white; } a { background: #6c757d; color: white; margin-left: 8px; }
        .helptext { display: block; color: #666; margin: 8px 0; } .errorlist { color: #b02a20; }
    </style>
</head>
<body>
    <header><h2>Campos do inventário — {{ escola.nome }}</h2></header>
    <main><div class="card">
        <p>Defina os campos da tabela. <strong>Local</strong> é padrão e sempre será texto.</p>
        <form method="post">{% csrf_token %}
            <div id="campos">
            {% for campo in campos %}
                <div class="linha">
                    <input name="nome_campo" value="{{ campo.nome }}" {% if campo.nome|lower == 'local' %}readonly{% endif %} required>
                    <select name="tipo_campo" {% if campo.nome|lower == 'local' %}disabled{% endif %}>
                        <option value="texto" {% if campo.tipo == 'texto' %}selected{% endif %}>Somente letras/texto</option>
                        <option value="numero" {% if campo.tipo == 'numero' %}selected{% endif %}>Somente números</option>
                        <option value="ambos" {% if campo.tipo == 'ambos' %}selected{% endif %}>Letras e números</option>
                    </select>
                    {% if campo.nome|lower == 'local' %}
                        <input type="hidden" name="tipo_campo" value="texto">
                        <span>🔒</span>
                    {% else %}
                        <button type="button" class="remover" onclick="this.parentElement.remove()">×</button>
                    {% endif %}
                </div>
            {% endfor %}
            </div>
            <button type="button" onclick="adicionarCampo()" style="background:#1f7299">+ Adicionar campo</button>
            <button type="submit">Salvar campos</button>
            <a href="{% url 'inventario_lista' %}">Cancelar</a>
        </form>
    </div></main>
    <script>
        function adicionarCampo() {
            document.getElementById('campos').insertAdjacentHTML('beforeend',
                '<div class="linha"><input name="nome_campo" placeholder="Nome do campo" required><select name="tipo_campo"><option value="texto">Somente letras/texto</option><option value="numero">Somente números</option><option value="ambos">Letras e números</option></select><button type="button" class="remover" onclick="this.parentElement.remove()">×</button></div>');
        }
    </script>
</body>
</html>
