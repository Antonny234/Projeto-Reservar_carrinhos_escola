{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar WhatsApp</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
<div class="login-box">
    <h2>Confirme seu WhatsApp</h2>
    <p style="text-align:center;">Digite o número de WhatsApp cadastrado nesta conta.</p>
    <form method="POST" action="{% url 'redefinir_senha_whatsapp' %}">
        {% csrf_token %}
        <div class="input-box">
            <input type="tel" name="whatsapp" placeholder="DDD + número, ex: 11999998888" required>
        </div>
        <button type="submit" class="login-btn">Enviar código</button>
    </form>
    {% if messages %}
        <div style="color: red; text-align: center; margin-top: 15px; font-size: 14px;">
        {% for message in messages %}{{ message }}{% endfor %}
        </div>
    {% endif %}
</div>
</body>
</html>
