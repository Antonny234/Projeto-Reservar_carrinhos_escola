{% load static %}

<!DOCTYPE html>

<html lang="pt-br">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PROATI 2026 - Cadastro de Administradores</title>


<style>

    /* ============================================================
       RESET
       ============================================================ */

    * {
        box-sizing: border-box;
    }


    html,
    body {
        margin: 0;
        padding: 0;

        width: 100%;
        min-height: 100%;

        font-family:
            'Segoe UI',
            Tahoma,
            Geneva,
            Verdana,
            sans-serif;

        background-color: #f0f2f5;

        color: #333;
    }


    /* ============================================================
       PÁGINA
       ============================================================ */

    body {

        min-height: 100vh;

        display: flex;

        justify-content: center;

        align-items: flex-start;

        padding: 50px 20px;
    }


    /* ============================================================
       CONTAINER
       ============================================================ */

    .cadastro-admin-container {

        width: 100%;

        max-width: 650px;

        margin: 0 auto;
    }


    /* ============================================================
       TÍTULO
       ============================================================ */

    .cadastro-admin-container h1 {

        margin: 0 0 20px 0;

        padding: 22px 25px;

        background-color: #1e3a5f;

        color: #ffffff;

        border-radius: 12px;

        font-size: 24px;

        font-weight: 600;

        line-height: 1.3;

        box-shadow:
            0 4px 15px rgba(0, 0, 0, 0.10);
    }


    /* ============================================================
       FORMULÁRIO
       ============================================================ */

    .cadastro-admin-container form {

        width: 100%;

        padding: 30px;

        background-color: #ffffff;

        border-radius: 12px;

        box-shadow:
            0 4px 20px rgba(0, 0, 0, 0.08);
    }


    /* ============================================================
       CAMPOS DO DJANGO
       ============================================================ */

    .cadastro-admin-container form p {

        margin: 0 0 18px 0;
    }


    .cadastro-admin-container form label {

        display: block;

        margin-bottom: 7px;

        color: #1e3a5f;

        font-size: 14px;

        font-weight: 600;
    }


    /* ============================================================
       INPUTS
       ============================================================ */

    .cadastro-admin-container form input,
    .cadastro-admin-container form select,
    .cadastro-admin-container form textarea {

        width: 100%;

        padding: 12px 14px;

        border: 1.5px solid #dce1e7;

        border-radius: 8px;

        background-color: #ffffff;

        color: #333333;

        font-family: inherit;

        font-size: 14px;

        outline: none;

        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease;
    }


    /* ============================================================
       INPUT — FOCO
       ============================================================ */

    .cadastro-admin-container form input:focus,
    .cadastro-admin-container form select:focus,
    .cadastro-admin-container form textarea:focus {

        border-color: #1e3a5f;

        box-shadow:
            0 0 0 3px rgba(30, 58, 95, 0.10);
    }


    /* ============================================================
       TEXTO DE AJUDA DO DJANGO
       ============================================================ */

    .helptext {

        display: block;

        margin-top: 5px;

        color: #777777;

        font-size: 12px;

        line-height: 1.4;
    }


    /* ============================================================
       ERROS DO FORMULÁRIO
       ============================================================ */

    ul.errorlist {

        margin: 5px 0 8px 0;

        padding: 0;

        list-style: none;

        color: #dc3545;

        font-size: 13px;

        font-weight: 500;
    }


    /* ============================================================
       ÁREA DOS BOTÕES
       ============================================================ */

    .acoes-formulario {

        display: flex;

        align-items: center;

        gap: 10px;

        margin-top: 25px;
    }


    /* ============================================================
       BOTÃO CADASTRAR
       ============================================================ */

    .acoes-formulario button {

        padding: 11px 24px;

        background-color: #1e3a5f;

        color: #ffffff;

        border: none;

        border-radius: 7px;

        font-family: inherit;

        font-size: 14px;

        font-weight: 600;

        cursor: pointer;

        transition:
            background-color 0.2s ease,
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }


    .acoes-formulario button:hover {

        background-color: #16304f;

        transform: translateY(-1px);

        box-shadow:
            0 4px 10px rgba(0, 0, 0, 0.15);
    }


    .acoes-formulario button:active {

        transform: translateY(0);
    }


    /* ============================================================
       BOTÃO CANCELAR
       ============================================================ */

    .acoes-formulario a {

        display: inline-block;

        padding: 10px 18px;

        background-color: #f8f9fa;

        color: #1e3a5f;

        border: 1px solid #dce1e7;

        border-radius: 7px;

        text-decoration: none;

        font-size: 14px;

        font-weight: 600;

        transition:
            background-color 0.2s ease,
            border-color 0.2s ease;
    }


    .acoes-formulario a:hover {

        background-color: #e9ecef;

        border-color: #c5ccd3;
    }


    /* ============================================================
       RESPONSIVO — TABLET
       ============================================================ */

    @media (max-width: 700px) {

        body {

            padding: 30px 15px;
        }


        .cadastro-admin-container h1 {

            padding: 18px 20px;

            font-size: 21px;
        }


        .cadastro-admin-container form {

            padding: 25px 20px;
        }
    }


    /* ============================================================
       RESPONSIVO — CELULAR
       ============================================================ */

    @media (max-width: 500px) {

        body {

            padding: 20px 10px;
        }


        .cadastro-admin-container h1 {

            padding: 16px;

            font-size: 19px;

            border-radius: 10px;
        }


        .cadastro-admin-container form {

            padding: 20px 16px;

            border-radius: 10px;
        }


        .acoes-formulario {

            flex-direction: column;

            align-items: stretch;
        }


        .acoes-formulario button,
        .acoes-formulario a {

            width: 100%;

            text-align: center;
        }
    }

</style>
```

</head>

<body>

```
<div class="cadastro-admin-container">


    <h1>
        Novo administrador — {{ escola.nome }}
    </h1>


    <form method="post">

        {% csrf_token %}


        {{ admin_form.as_p }}


        <div class="acoes-formulario">

            <button type="submit">
                Cadastrar
            </button>


            <a href="{% url 'gerenciar_escola' escola.id %}">
                Cancelar
            </a>

        </div>

    </form>


</div>
```

</body>

</html>
