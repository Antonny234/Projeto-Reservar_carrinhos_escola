[phases.setup]
aptPkgs = []

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install --no-cache-dir -r requirements.txt"
]

[phases.build]
cmds = [
  ". /opt/venv/bin/activate && python manage.py check --deploy",
  ". /opt/venv/bin/activate && python manage.py collectstatic --no-input"
]

[start]
cmd = ". /opt/venv/bin/activate && python manage.py migrate --noinput && gunicorn configuracao.wsgi:application --log-level info --access-logfile - --error-logfile - --bind 0.0.0.0:$PORT"
