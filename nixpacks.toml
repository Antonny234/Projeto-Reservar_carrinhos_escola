[phases.setup]
aptPkgs = ["libgl1", "libglib2.0-0", "libsm6", "libxext6", "libxrender1", "libxcb1"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install -r requirements.txt",
  ". /opt/venv/bin/activate && pip install --force-reinstall --no-deps opencv-python-headless==4.10.0.84"
]

[phases.build]
cmds = [
  ". /opt/venv/bin/activate && python manage.py collectstatic --no-input"
]

[start]
cmd = ". /opt/venv/bin/activate && python manage.py migrate && gunicorn configuracao.wsgi --log-file - --bind 0.0.0.0:$PORT"